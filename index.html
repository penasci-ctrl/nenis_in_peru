<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#F4F4F0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Peru"/>
<link rel="apple-touch-icon" sizes="180x180" href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Flag_of_Peru.svg/180px-Flag_of_Peru.svg.png"/>
<title>Peru · Pedro & Marina</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap"/>
<style>
/* ── BRAND KIT 1.0 – TOKENS ── */
:root{
  --bg-primary:#F4F4F0;--bg-secondary:#ECECE6;--bg-tertiary:#E0E0D8;
  --ink-primary:#0A0A0A;--ink-secondary:#4A4A48;--ink-tertiary:#8A8A85;
  --line:#0A0A0A;--line-subtle:#C8C8C0;
  --cat-transport:#2E4BFF;--cat-activity:#1F7A3D;--cat-food:#E85D2C;--cat-lodging:#6B3FA0;
  --signal-urgent:#D72638;--signal-warn:#C47A00;--signal-ok:#1F7A3D;
  --type-display:'Instrument Serif',Georgia,serif;
  --type-body:'DM Sans',system-ui,-apple-system,sans-serif;
  --type-mono:'JetBrains Mono',ui-monospace,'SF Mono',monospace;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;
  --radius-none:0;--radius-sm:2px;--radius-md:4px;--radius-pill:999px;
  --dur-fast:140ms;--dur-base:220ms;
  --ease-out:cubic-bezier(0.2,0.8,0.2,1);
  /* ── backward-compat aliases (render-fn inline styles) ── */
  --bg:var(--bg-primary);--bg-card:var(--bg-secondary);--bg-sunken:var(--bg-tertiary);--bg-input:var(--bg-tertiary);
  --ink:var(--ink-primary);--ink-2:var(--ink-secondary);--ink-3:var(--ink-tertiary);--ink-4:var(--ink-tertiary);
  --line-soft:var(--line-subtle);
  --c-tr:var(--cat-transport);--c-ac:var(--cat-activity);--c-fd:var(--cat-food);--c-lo:var(--cat-lodging);
  --c-al:var(--signal-urgent);--c-in:var(--ink-tertiary);
  --c-tr-bg:color-mix(in oklab,var(--cat-transport) 8%,var(--bg-primary));
  --c-ac-bg:color-mix(in oklab,var(--cat-activity) 8%,var(--bg-primary));
  --c-fd-bg:color-mix(in oklab,var(--cat-food) 8%,var(--bg-primary));
  --c-lo-bg:color-mix(in oklab,var(--cat-lodging) 8%,var(--bg-primary));
  --c-al-bg:color-mix(in oklab,var(--signal-urgent) 6%,var(--bg-primary));
  --c-in-bg:var(--bg-secondary);
  --c-tr-bd:color-mix(in oklab,var(--cat-transport) 28%,var(--bg-primary));
  --c-ac-bd:color-mix(in oklab,var(--cat-activity) 28%,var(--bg-primary));
  --c-fd-bd:color-mix(in oklab,var(--cat-food) 28%,var(--bg-primary));
  --c-lo-bd:color-mix(in oklab,var(--cat-lodging) 28%,var(--bg-primary));
  --c-al-bd:color-mix(in oklab,var(--signal-urgent) 22%,var(--bg-primary));
  --c-in-bd:var(--line-subtle);
  --green:var(--signal-ok);--orange:var(--signal-warn);--red:var(--signal-urgent);--blue:var(--cat-transport);
  --font:var(--type-body);--mono:var(--type-mono);
  --r:0px;--r-sm:var(--radius-md);--r-xs:var(--radius-sm);
  --sh:none;--sh-md:none;
}
@media(prefers-color-scheme:dark){:root{
  --bg-primary:#0A0A0A;--bg-secondary:#161614;--bg-tertiary:#222220;
  --ink-primary:#F4F4F0;--ink-secondary:#B8B8B2;--ink-tertiary:#6A6A65;
  --line:#F4F4F0;--line-subtle:#2A2A28;
  --cat-transport:#6B82FF;--cat-activity:#4DA86A;--cat-food:#FF7A4A;--cat-lodging:#9B72D0;
  --signal-ok:#4DA86A;
}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{
  animation-duration:80ms!important;transition-duration:80ms!important;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg-primary);color:var(--ink-primary);font-family:var(--type-body);
  -webkit-font-smoothing:antialiased;min-height:100vh;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;background:none;border:0;outline:none}
a{color:var(--cat-transport);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--ink-primary);outline-offset:2px}

/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:100;background:var(--bg-primary);
  border-bottom:1px solid var(--line)}
.hdr-in{max-width:760px;margin:0 auto;padding:var(--sp-4);
  display:flex;align-items:center;justify-content:space-between;min-height:56px}
.hdr-left{display:flex;flex-direction:column;gap:2px}
.hdr-screen-label{font-family:var(--type-mono);font-size:11px;font-weight:700;
  letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-primary)}
.hdr-trip-day{font-family:var(--type-mono);font-size:10px;color:var(--ink-tertiary);
  letter-spacing:0.08em}
.hdr-weather{display:flex;align-items:center;gap:var(--sp-2);cursor:pointer;
  padding:var(--sp-2) var(--sp-3);border:1px solid var(--line-subtle);
  border-radius:var(--radius-md);transition:background var(--dur-fast) var(--ease-out)}
.hdr-weather:hover{background:var(--bg-secondary)}
.hdr-temp{font-family:var(--type-mono);font-size:13px;font-weight:500;
  font-variant-numeric:tabular-nums}
.hdr-loc{font-family:var(--type-mono);font-size:10px;text-transform:uppercase;
  letter-spacing:0.08em;color:var(--ink-tertiary)}
.hdr-icon{font-size:16px}
.hdr-skeleton{display:inline-block;background:var(--line-subtle);border-radius:var(--radius-sm);
  animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── KPI ── */
.kpi{max-width:760px;margin:0 auto;padding:var(--sp-4);padding-bottom:0;
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;
  border-bottom:1px solid var(--line)}
.kc{background:var(--bg-secondary);padding:var(--sp-3) var(--sp-4)}
.kc-l{font-family:var(--type-mono);font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.16em;color:var(--ink-tertiary)}
.kc-v{font-family:var(--type-mono);font-size:24px;font-weight:700;letter-spacing:-0.02em;
  margin-top:var(--sp-1);font-variant-numeric:tabular-nums}
.kc-v small{font-size:11px;font-weight:400;color:var(--ink-tertiary);margin-left:2px;
  font-family:var(--type-body)}
.kc-u{background:color-mix(in oklab,var(--signal-urgent) 6%,var(--bg-primary))}
.kc-u .kc-l,.kc-u .kc-v{color:var(--signal-urgent)}

/* ── MAIN ── */
main{max-width:760px;margin:0 auto;padding:var(--sp-4);padding-bottom:80px}
.p{display:none}.p.on{display:block;animation:fi var(--dur-base) var(--ease-out)}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sh{font-family:var(--type-mono);font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.16em;color:var(--ink-tertiary);margin:var(--sp-6) 0 var(--sp-2);padding:0}
.sh:first-child{margin-top:var(--sp-3)}
.card{background:var(--bg-secondary);border:1px solid var(--line);overflow:hidden}
.card+.card{margin-top:-1px}

/* ── MAIS – sub-navigation ── */
.mais-back{display:flex;align-items:center;gap:var(--sp-2);
  font-family:var(--type-mono);font-size:11px;font-weight:700;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--ink-tertiary);padding:var(--sp-3) 0 var(--sp-4);
  cursor:pointer;transition:color var(--dur-fast)}
.mais-back:hover{color:var(--ink-primary)}
.mais-grid{display:flex;flex-direction:column;border:1px solid var(--line)}
.mais-item{display:flex;align-items:center;justify-content:space-between;
  padding:var(--sp-4) var(--sp-4);border-bottom:1px solid var(--line-subtle);
  cursor:pointer;transition:background var(--dur-fast) var(--ease-out);text-align:left}
.mais-item:last-child{border-bottom:0}
.mais-item:hover{background:var(--bg-tertiary)}
.mais-item-label{font-family:var(--type-mono);font-size:13px;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase}
.mais-item-sub{font-size:12px;color:var(--ink-tertiary);margin-top:2px}
.mais-item-arr{font-family:var(--type-mono);color:var(--ink-tertiary);font-size:14px}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:var(--bg-primary);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:12px var(--sp-2) 10px;
  font-family:var(--type-mono);font-size:10px;font-weight:700;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--ink-tertiary);
  transition:color var(--dur-fast) var(--ease-out);position:relative}
.bnav-btn::after{content:'';width:4px;height:4px;border-radius:50%;
  background:var(--ink-primary);opacity:0;
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  transition:opacity var(--dur-fast)}
.bnav-btn.on{color:var(--ink-primary)}
.bnav-btn.on::after{opacity:1}
.bnav-btn:active{background:var(--bg-secondary)}

/* ── CHECKLIST ── */
.ck-row{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);
  border-bottom:1px solid var(--line-subtle);cursor:pointer;
  transition:background var(--dur-fast) var(--ease-out)}
.ck-row:last-child{border-bottom:0}
.ck-row:active{background:var(--bg-tertiary)}
.ck-dot{flex:0 0 20px;width:20px;height:20px;border-radius:var(--radius-sm);
  border:1px solid var(--line);display:grid;place-items:center;
  transition:all var(--dur-fast);margin-top:1px;flex-shrink:0}
.ck-dot.on{background:var(--ink-primary);border-color:var(--ink-primary)}
.ck-dot.on::after{content:"";width:9px;height:5px;border:2px solid var(--bg-primary);
  border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ck-body{flex:1;min-width:0}
.ck-t{font-size:14px;font-weight:500;letter-spacing:-0.01em}
.ck-t.on{color:var(--ink-tertiary);text-decoration:line-through;text-decoration-thickness:1px}
.ck-m{font-size:12px;color:var(--ink-tertiary);margin-top:2px;line-height:1.45}
.ck-tags{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-2)}
.ck-dead{font-family:var(--type-mono);font-size:10px;font-weight:700;
  color:var(--signal-urgent);margin-top:var(--sp-1);text-transform:uppercase;letter-spacing:0.08em}
.pill{font-family:var(--type-mono);font-size:10px;font-weight:700;padding:2px var(--sp-2);
  border-radius:var(--radius-sm);text-transform:uppercase;letter-spacing:0.08em;border:1px solid}
.pu{border-color:var(--signal-urgent);color:var(--signal-urgent);background:transparent}
.pw{border-color:var(--signal-warn);color:var(--signal-warn);background:transparent}
.pn{border-color:var(--line-subtle);color:var(--ink-tertiary);background:transparent}

/* ── AGENDA ── */
.day{background:var(--bg-secondary);border:1px solid var(--line);overflow:hidden;margin-bottom:-1px}
.day-top{padding:var(--sp-3) var(--sp-4);display:flex;align-items:baseline;gap:var(--sp-2);
  border-bottom:1px solid var(--line-subtle)}
.d-num{font-family:var(--type-mono);font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.12em;color:var(--ink-tertiary)}
.d-date{font-family:var(--type-mono);font-size:15px;font-weight:700;letter-spacing:-0.01em;
  font-variant-numeric:tabular-nums}
.d-city{font-family:var(--type-mono);font-size:10px;color:var(--ink-tertiary);margin-left:auto;
  text-transform:uppercase;letter-spacing:0.08em}
.d-bday{display:inline-block;border:1px solid var(--cat-food);border-radius:var(--radius-sm);
  padding:1px var(--sp-2);font-family:var(--type-mono);font-size:10px;color:var(--cat-food);
  font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-left:var(--sp-2)}
.d-title{font-size:13px;color:var(--ink-secondary);padding:var(--sp-2) var(--sp-4) var(--sp-1);
  letter-spacing:-0.005em;line-height:1.45;outline:none}
.d-title:focus{background:color-mix(in oklab,var(--cat-transport) 5%,transparent)}

/* Period */
.period{border-top:1px solid var(--line-subtle)}
.period-h{padding:var(--sp-2) var(--sp-4) var(--sp-1);font-family:var(--type-mono);font-size:10px;
  font-weight:700;text-transform:uppercase;letter-spacing:0.16em;color:var(--ink-tertiary);outline:none}
.period-h:focus{background:color-mix(in oklab,var(--cat-transport) 5%,transparent)}

/* Event row */
.ev{display:flex;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);
  align-items:flex-start;position:relative;cursor:pointer;
  transition:background var(--dur-fast) var(--ease-out);
  border-bottom:1px solid var(--line-subtle)}
.ev:last-of-type{border-bottom:0}
.ev:active{background:var(--bg-tertiary)}
.ev.dragging{opacity:.4;background:var(--bg-tertiary)}
.ev.drag-over{border-top:2px solid var(--cat-transport)}
.ev-handle{font-family:var(--type-mono);color:var(--ink-tertiary);font-size:12px;
  cursor:grab;padding:2px 4px 2px 0;opacity:0;transition:opacity var(--dur-fast);
  align-self:center;flex-shrink:0;touch-action:none}
.ev:hover .ev-handle{opacity:1}
.ev-stripe{width:3px;min-height:36px;flex-shrink:0;margin-top:2px}
.s-tr{background:var(--cat-transport)}.s-ac{background:var(--cat-activity)}
.s-fd{background:var(--cat-food)}.s-lo{background:var(--cat-lodging)}
.s-al{background:var(--signal-urgent)}.s-in{background:var(--line-subtle)}
.ev-body{flex:1;min-width:0}
.ev-top{display:flex;align-items:baseline;gap:var(--sp-2)}
.ev-time{font-family:var(--type-mono);font-size:11px;color:var(--ink-tertiary);
  flex-shrink:0;min-width:44px;outline:none;border-radius:var(--radius-sm);
  font-variant-numeric:tabular-nums}
.ev-time:focus{background:color-mix(in oklab,var(--cat-transport) 6%,transparent);padding:0 2px}
.ev-icon{font-size:13px;flex-shrink:0}
.ev-name{font-size:14px;font-weight:500;letter-spacing:-0.01em;flex:1;outline:none;
  border-radius:var(--radius-sm)}
.ev-name:focus{background:color-mix(in oklab,var(--cat-transport) 6%,transparent);padding:0 2px}
.ev-desc{font-size:12px;color:var(--ink-tertiary);line-height:1.55;
  padding:var(--sp-1) 0 2px;display:none;outline:none;border-radius:var(--radius-sm)}
.ev-desc.open{display:block}
.ev-desc:focus{background:color-mix(in oklab,var(--cat-transport) 6%,transparent);padding:4px;display:block}
.ev-chev{font-family:var(--type-mono);color:var(--ink-tertiary);font-size:12px;
  transition:transform var(--dur-fast);flex-shrink:0;padding:4px;
  margin:-4px;align-self:flex-start;margin-top:-2px}
.ev-chev.open{transform:rotate(90deg)}
.ev-actions{display:flex;gap:var(--sp-1);margin-left:var(--sp-1);align-items:flex-start}
.ev-del{width:24px;height:24px;border-radius:var(--radius-sm);font-size:11px;font-family:var(--type-mono);
  color:var(--ink-tertiary);opacity:0;transition:all var(--dur-fast);display:grid;place-items:center;flex-shrink:0}
.ev:hover .ev-del{opacity:1}
.ev-del:hover{color:var(--signal-urgent);background:color-mix(in oklab,var(--signal-urgent) 8%,transparent)}
.ev-cat-sel{font-size:11px;padding:2px 4px;border-radius:var(--radius-sm);
  background:var(--bg-tertiary);border:1px solid var(--line-subtle);color:var(--ink-tertiary);
  opacity:0;transition:opacity var(--dur-fast);cursor:pointer}
.ev:hover .ev-cat-sel{opacity:1}
.sort-btn{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);
  margin:var(--sp-1) var(--sp-4) 0;font-family:var(--type-mono);font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-tertiary);
  border:1px solid var(--line-subtle);border-radius:var(--radius-sm);
  background:transparent;transition:all var(--dur-fast);width:fit-content}
.sort-btn:hover{color:var(--cat-transport);border-color:var(--cat-transport)}
.ev-add{display:block;width:calc(100% - 32px);margin:var(--sp-2) var(--sp-4) var(--sp-3);
  padding:var(--sp-2);font-family:var(--type-mono);font-size:10px;font-weight:700;
  color:var(--ink-tertiary);border-radius:var(--radius-sm);
  border:1px dashed var(--line-subtle);background:transparent;
  text-transform:uppercase;letter-spacing:0.08em;
  transition:all var(--dur-fast);text-align:center}
.ev-add:hover{background:var(--bg-tertiary);color:var(--ink-primary);border-color:var(--line)}
.d-notes-lbl{font-family:var(--type-mono);font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.12em;color:var(--ink-tertiary);padding:0 var(--sp-4);
  margin-top:var(--sp-2);display:block}
.d-notes{display:block;width:calc(100% - 32px);margin:var(--sp-1) var(--sp-4) var(--sp-4);
  padding:var(--sp-2) var(--sp-3);min-height:36px;resize:vertical;border-radius:var(--radius-sm);
  background:var(--bg-tertiary);border:1px solid var(--line-subtle);
  font-size:12px;color:var(--ink-secondary);transition:border-color var(--dur-fast)}
.d-notes:focus{border-color:var(--ink-primary)}
.d-notes::placeholder{color:var(--ink-tertiary)}

/* ── BAGAGEM ── */
.bag-progress{height:2px;background:var(--line-subtle);margin-bottom:var(--sp-4)}
.bag-bar{height:100%;background:var(--signal-ok);transition:width 0.3s}
.bag-group-head{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-2)}
.bag-count{font-family:var(--type-mono);font-size:10px;color:var(--ink-tertiary);
  margin-left:auto;font-variant-numeric:tabular-nums}
.bag-row{display:flex;align-items:center;gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line-subtle)}
.bag-row:last-child{border-bottom:0}
.bag-checks{display:flex;gap:var(--sp-2);flex-shrink:0}
.bag-check{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.bag-dot{width:22px;height:22px;border-radius:var(--radius-sm);
  border:1px solid var(--line);display:grid;place-items:center;transition:all var(--dur-fast)}
.bag-dot.tenho{background:var(--cat-transport);border-color:var(--cat-transport)}
.bag-dot.mala{background:var(--signal-ok);border-color:var(--signal-ok)}
.bag-dot.tenho::after,.bag-dot.mala::after{content:"";width:9px;height:5px;
  border:2px solid var(--bg-primary);border-top:0;border-right:0;
  transform:rotate(-45deg) translate(1px,-1px)}
.bag-dot-lbl{font-family:var(--type-mono);font-size:8px;font-weight:700;
  text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-tertiary)}
.bag-text{flex:1;font-size:13px;font-weight:500;letter-spacing:-0.008em;
  outline:none;border-radius:var(--radius-sm)}
.bag-text:focus{background:color-mix(in oklab,var(--cat-transport) 6%,transparent);padding:0 3px}
.bag-text.packed{color:var(--ink-tertiary);text-decoration:line-through;text-decoration-thickness:1px}
.bag-del{width:24px;height:24px;border-radius:var(--radius-sm);font-family:var(--type-mono);font-size:10px;
  color:var(--ink-tertiary);opacity:0;transition:all var(--dur-fast);display:grid;place-items:center}
.bag-row:hover .bag-del{opacity:1}
.bag-del:hover{color:var(--signal-urgent);
  background:color-mix(in oklab,var(--signal-urgent) 8%,transparent)}
.bag-add{display:block;width:calc(100% - 32px);margin:var(--sp-2) var(--sp-4) var(--sp-3);
  padding:var(--sp-2);font-family:var(--type-mono);font-size:10px;font-weight:700;
  color:var(--ink-tertiary);border-radius:var(--radius-sm);
  border:1px dashed var(--line-subtle);background:transparent;

let wCache={};
async function fetchW(lat,lon){
  const k=`${lat},${lon}`;if(wCache[k]) return wCache[k];
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&forecast_days=1&timezone=auto`);
    const j=await r.json();
    const res={temp:Math.round(j.current.temperature_2m),icon:wIcon(j.current.weather_code)};
    wCache[k]=res;return res;
  }catch{return null}
}
function wIcon(c){
  if(c===0)return"☀️";if(c<=2)return"🌤️";if(c<=3)return"☁️";
  if(c<=48)return"🌫️";if(c<=67)return"🌧️";if(c<=77)return"🌨️";
  if(c<=82)return"🌧️";if(c<=99)return"⛈️";return"🌡️";
}
async function updateHeaderWeather(){
  const now=new Date();
  let city=CITY_WEATHER[0];
  if(now>=CFG.TRIP_START){
    const day=Math.floor((now-CFG.TRIP_START)/864e5)+1;
    const ag=AGENDA_DEFAULT.find(d=>d.d===day);
    if(ag){
      const nm=ag.city.split("→")[0].trim().toUpperCase();
      const m=CITY_WEATHER.find(c=>nm.includes(c.city.toUpperCase()));
      if(m) city=m;
    }
  }
  const w=await fetchW(city.lat,city.lon);
  const ti=document.getElementById("hdr-icon");
  const tt=document.getElementById("hdr-temp");
  const tl=document.getElementById("hdr-loc");
  if(w){ti.textContent=w.icon;tt.textContent=w.temp+"°C";tl.textContent=city.city.toUpperCase();}
  else{ti.textContent="";tt.textContent="—";tl.textContent="";}
}

================================================================ */
const S={checks:{},agenda:{},bag:{},bagItems:null,notes:{}};
const ls={
  g:(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}},
  s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
};
async function load(){
  S.checks=ls.g("ck",{});S.agenda=ls.g("ag",{});
  S.bag=ls.g("bg",{});S.bagItems=ls.g("bagitems",null);S.notes=ls.g("nt",{});
}

/* ================================================================
   AGENDA HELPERS
================================================================ */
function getDay(d){
  const base=AGENDA_DEFAULT.find(x=>x.d===d);if(!base) return null;
  const ov=S.agenda[d]||{};
  const out={d:base.d,date:ov.date??base.date,city:ov.city??base.city,
    title:ov.title??base.title,bday:base.bday,periods:[]};
  const bps=base.periods,ops=ov.periods||[];
  const len=Math.max(bps.length,ops.length);
  for(let pi=0;pi<len;pi++){
    const bp=bps[pi]||{p:"",evs:[]},op=ops[pi]||{};
    const period={p:op.p??bp.p,evs:[]};
    const bes=bp.evs||[],oes=op.evs||[];
    for(let ei=0;ei<Math.max(bes.length,oes.length);ei++){
      const be=bes[ei]||{t:"",n:"",d:"",c:"info"},oe=oes[ei]||{};
      period.evs.push({t:oe.t??be.t,n:oe.n??be.n,d:oe.d??be.d,c:oe.c??be.c});
    }
    out.periods.push(period);
  }
  return out;
}
function saveAgenda(d,patch){S.agenda[d]={...(S.agenda[d]||{}),...patch};ls.s("ag",S.agenda)}
function savePeriods(d,periods){S.agenda[d]={...(S.agenda[d]||{}),periods};ls.s("ag",S.agenda)}

function parseTime(t){
  const s=String(t||"").trim();
  const m=s.match(/(\d{1,2})[:\.](\d{2})/);
  if(m) return parseInt(m[1])*60+parseInt(m[2]);
  return 9999; // no parseable time → end
}
function sortEvsByTime(evs){
  return [...evs].sort((a,b)=>parseTime(a.t)-parseTime(b.t));
}

function serializeDay(dayEl){
  const periods=[];
  dayEl.querySelectorAll(".period").forEach(p=>{
    const ph=p.querySelector(".period-h");
    const evs=[];
    p.querySelectorAll(".ev").forEach(e=>{
      evs.push({
        t:e.querySelector(".ev-time").textContent.trim(),
        n:e.querySelector(".ev-name").textContent.trim(),
        d:e.querySelector(".ev-desc")?.textContent.trim()||"",
        c:e.dataset.cat||"info",
      });
    });
    periods.push({p:ph?ph.textContent.trim():"",evs});
  });
  return periods;
}

/* ================================================================
   DRAG AND DROP
================================================================ */
let dragSrc=null;
function initDrag(evEl,dayEl,dayNum){
  evEl.setAttribute("draggable","true");
  evEl.querySelector(".ev-handle").style.display="flex";

  evEl.addEventListener("dragstart",e=>{
    dragSrc=evEl;evEl.classList.add("dragging");
    e.dataTransfer.effectAllowed="move";
  });
  evEl.addEventListener("dragend",()=>{
    evEl.classList.remove("dragging");
    dayEl.querySelectorAll(".ev").forEach(el=>el.classList.remove("drag-over"));
    // auto-sort after drop
    const periods=serializeDay(dayEl);
    periods.forEach(p=>{p.evs=sortEvsByTime(p.evs)});
    savePeriods(dayNum,periods);
    renderAgendaDay(dayEl,dayNum);
  });
  evEl.addEventListener("dragover",e=>{
    e.preventDefault();e.dataTransfer.dropEffect="move";
    if(dragSrc&&dragSrc!==evEl){
      dayEl.querySelectorAll(".ev").forEach(el=>el.classList.remove("drag-over"));
      evEl.classList.add("drag-over");
    }
  });
  evEl.addEventListener("drop",e=>{
    e.preventDefault();
    if(dragSrc&&dragSrc!==evEl){
      const parent=evEl.parentNode;
      parent.insertBefore(dragSrc,evEl);
      evEl.classList.remove("drag-over");
    }
  });
}

/* ================================================================
   RENDER AGENDA DAY (reusable)
================================================================ */
const CATS_OPTS=CATS.map(k=>`<option value="${k}">${CAT[k].i} ${k}</option>`).join("");

function makeEvEl(ev,dayNum){
  const cat=CAT[ev.c]||CAT.info;
  const div=document.createElement("div");
  div.className="ev";div.dataset.cat=ev.c;
  div.innerHTML=`
    <span class="ev-handle" style="display:none;align-items:center">⠿</span>
    <div class="ev-stripe ${cat.s}"></div>
    <div class="ev-body">
      <div class="ev-top">
        <span class="ev-time" contenteditable="plaintext-only">${ev.t}</span>
        <span class="ev-icon">${cat.i}</span>
        <span class="ev-name" contenteditable="plaintext-only">${ev.n}</span>
      </div>
      <div class="ev-desc${ev.d?" open":""}" contenteditable="plaintext-only">${ev.d||""}</div>
    </div>
    <div class="ev-actions">
      <select class="ev-cat-sel">${CATS_OPTS}</select>
      <button class="ev-del" title="Remover">✕</button>
    </div>
    <span class="ev-chev${ev.d?" open":""}">›</span>`;
  div.querySelector(".ev-cat-sel").value=ev.c;
  return div;
}

function renderAgendaDay(dayEl,dayNum){
  const day=getDay(dayNum);if(!day) return;
  const periodsContainer=dayEl.querySelector(".periods-wrap");
  if(!periodsContainer) return;
  periodsContainer.innerHTML="";
  day.periods.forEach((per,pi)=>{
    const pDiv=document.createElement("div");
    pDiv.className="period";pDiv.dataset.pi=pi;
    pDiv.innerHTML=`<div class="period-h" contenteditable="plaintext-only">${per.p}</div>`;
    per.evs.forEach(e=>{
      const evEl=makeEvEl(e,dayNum);
      pDiv.appendChild(evEl);
      initDrag(evEl,dayEl,dayNum);
    });
    // Sort button
    const sb=document.createElement("button");
    sb.className="sort-btn";sb.textContent="↑↓ Ordenar por horário";sb.dataset.pi=pi;
    // Add button
    const ab=document.createElement("button");
    ab.className="ev-add";ab.textContent="+ ADICIONAR ITEM";ab.dataset.pi=pi;
    periodsContainer.appendChild(pDiv);
    periodsContainer.appendChild(sb);
    periodsContainer.appendChild(ab);
  });
  bindDayEl(dayEl,dayNum);
}

function bindDayEl(dayEl,dayNum){
  const autoSave=()=>{
    const periods=serializeDay(dayEl);savePeriods(dayNum,periods);
  };
  dayEl.querySelectorAll("[contenteditable]").forEach(el=>{
    el.addEventListener("blur",autoSave);
  });
  dayEl.querySelector(".d-title")?.addEventListener("blur",e=>{
    saveAgenda(dayNum,{title:e.target.textContent.trim()});
  });
  dayEl.querySelector(".d-date")?.addEventListener("blur",e=>{
    saveAgenda(dayNum,{date:e.target.textContent.trim()});
  });
  dayEl.querySelector(".d-city")?.addEventListener("blur",e=>{
    saveAgenda(dayNum,{city:e.target.textContent.trim()});
  });

  dayEl.querySelectorAll(".ev").forEach(evEl=>{
    // chev + tap to expand
    const chev=evEl.querySelector(".ev-chev");
    const desc=evEl.querySelector(".ev-desc");
    chev.addEventListener("click",e=>{
      e.stopPropagation();
      desc.classList.toggle("open");chev.classList.toggle("open");
    });
    evEl.addEventListener("click",e=>{
      if(e.target.closest("[contenteditable]")||e.target.closest("select")||
         e.target.closest(".ev-del")||e.target.closest(".ev-chev")||
         e.target.closest(".ev-handle")) return;
      desc.classList.toggle("open");chev.classList.toggle("open");
    });
    // cat select
    const sel=evEl.querySelector(".ev-cat-sel");
    sel.addEventListener("change",()=>{
      const c=sel.value;evEl.dataset.cat=c;const cat=CAT[c]||CAT.info;
      evEl.querySelector(".ev-stripe").className=`ev-stripe ${cat.s}`;
      evEl.querySelector(".ev-icon").textContent=cat.i;
      autoSave();
    });
    // delete
    evEl.querySelector(".ev-del").addEventListener("click",e=>{
      e.stopPropagation();evEl.remove();autoSave();
    });
    // drag
    initDrag(evEl,dayEl,dayNum);
  });

  // Sort buttons
  dayEl.querySelectorAll(".sort-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const pi=parseInt(btn.dataset.pi);
      const periods=serializeDay(dayEl);
      if(periods[pi]) periods[pi].evs=sortEvsByTime(periods[pi].evs);
      savePeriods(dayNum,periods);
      renderAgendaDay(dayEl,dayNum);
    });
  });

  // Add buttons
  dayEl.querySelectorAll(".ev-add").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const pi=parseInt(btn.dataset.pi);
      const periods=serializeDay(dayEl);
      if(!periods[pi]) return;
      periods[pi].evs.push({t:"Horário",n:"Novo item",d:"Descrição",c:"info"});
      savePeriods(dayNum,periods);
      renderAgendaDay(dayEl,dayNum);
    });
  });

  // Notes
  const ta=dayEl.querySelector(".d-notes");
  if(ta){let t;ta.addEventListener("input",()=>{
    clearTimeout(t);t=setTimeout(()=>{S.notes[dayNum]=ta.value;ls.s("nt",S.notes)},400);
  });}
}

function renderKpi(){
  const now=new Date(),diff=CFG.TRIP_START-now;
  const days=Math.max(0,Math.floor(diff/864e5));
  let pend=0,urg=0;
  CHECKLIST.forEach(g=>{if(!g.done) g.items.forEach(i=>{
    if(!S.checks[i.id]){pend++;if(i.tags&&i.tags[0][1]==="u") urg++;}
  })});
  document.getElementById("kpi").innerHTML=`
    <div class="kc"><div class="kc-l">FALTAM</div><div class="kc-v">${days}<small>dias</small></div></div>
    <div class="kc kc-u"><div class="kc-l">URGENTE</div><div class="kc-v">${urg}<small>itens</small></div></div>
    <div class="kc"><div class="kc-l">PENDENTES</div><div class="kc-v">${pend}<small>itens</small></div></div>`;
}

function renderHoje(){
  const el=document.getElementById("hoje");
  const now=new Date();
  const inTrip=now>=CFG.TRIP_START&&now<=CFG.TRIP_END;
  const dayNum=Math.floor((now-CFG.TRIP_START)/864e5)+1;
  if(!inTrip){
    const days=Math.ceil((CFG.TRIP_START-now)/864e5);
    const urgentes=CHECKLIST[0].items.filter(i=>!S.checks[i.id]);
    el.innerHTML=`
      <div class="hoje-hero"><div class="hoje-top">
        <div class="hoje-label">CONTAGEM REGRESSIVA</div>
        <div class="hoje-date">${days}</div>
        <div class="hoje-city">DIAS PARA EMBARCAR · 28 DE JUNHO</div>
      </div></div>
      <div class="sh">PRÓXIMAS URGÊNCIAS</div>
      <div class="card">${urgentes.slice(0,3).map(i=>{
        let dead="";
        if(i.deadline){const d=new Date(i.deadline),dif=Math.ceil((d-now)/864e5);
          dead=`<div class="ck-dead">${dif>0?`⏰ COMPRAR EM ATÉ ${dif} DIAS`:"⚠️ PRAZO VENCIDO"}</div>`;}
        return `<div class="ck-row"><div class="ck-dot"></div>
          <div class="ck-body"><div class="ck-t">${i.t}</div>
          <div class="ck-m">${i.m||""}</div>${dead}</div></div>`;
      }).join("")}</div>
      <div class="sh">ANOTAÇÕES</div>
      <div class="card"><textarea class="d-notes" data-note="0"
        placeholder="Notas pré-viagem…">${S.notes[0]||""}</textarea></div>`;
  } else {
    const day=getDay(dayNum);
    if(!day){el.innerHTML=`<div class="pre-trip"><div class="big">🎉</div><div class="lbl">Viagem concluída!</div></div>`;return;}
    const allEvs=day.periods.flatMap(p=>p.evs.map(e=>({...e,period:p.p})));
    el.innerHTML=`
      <div class="hoje-hero"><div class="hoje-top">
        <div class="hoje-label">HOJE · DIA ${day.d} DE 15</div>
        <div class="hoje-date">${day.date}</div>
        <div class="hoje-city">${day.city}</div>
      </div>
      <div style="padding:14px 16px 4px">
        ${allEvs.map(e=>{const cat=CAT[e.c]||CAT.info;return`
          <div class="hoje-ev">
            <div class="hoje-ev-time">${e.t}</div>
            <div class="hoje-ev-stripe ${cat.s}"></div>
            <div><div class="hoje-ev-name">${cat.i} ${e.n}</div>
            ${e.d?`<div class="hoje-ev-desc">${e.d}</div>`:""}</div>
          </div>`;}).join("")}
      </div></div>
      <div class="sh">ANOTAÇÕES DE HOJE</div>
      <div class="card"><textarea class="d-notes" data-note="${dayNum}"
        placeholder="Anote aqui…">${S.notes[dayNum]||""}</textarea></div>`;
  }
  el.querySelectorAll("[data-note]").forEach(ta=>{let t;ta.addEventListener("input",()=>{
    clearTimeout(t);t=setTimeout(()=>{S.notes[ta.dataset.note]=ta.value;ls.s("nt",S.notes)},400);
  })});
}

function renderChecklist(){
  const el=document.getElementById("checklist");const now=new Date();
  el.innerHTML=CHECKLIST.map(g=>`
    <div class="sh">${g.g}</div><div class="card">
    ${g.items.map(i=>{const on=g.done||S.checks[i.id];
      let dead="";
      if(i.deadline&&!on){const d=new Date(i.deadline),dif=Math.ceil((d-now)/864e5);
        dead=`<div class="ck-dead">${dif>0?`⏰ COMPRAR EM ATÉ ${dif} DIAS`:"⚠️ PRAZO VENCIDO"}</div>`;}
      return`<div class="ck-row" data-ck="${i.id}" data-done="${g.done?1:0}">
        <div class="ck-dot${on?" on":""}"></div>
        <div class="ck-body">
          <div class="ck-t${on?" on":""}">${i.t}</div>
          ${i.m?`<div class="ck-m">${i.m}</div>`:""}
          ${i.tags?`<div class="ck-tags">${i.tags.map(([t,k])=>`<span class="pill p${k}">${t}</span>`).join("")}</div>`:""}
          ${dead}
        </div></div>`;
    }).join("")}</div>`).join("");
  el.querySelectorAll("[data-ck]").forEach(r=>r.addEventListener("click",()=>{
    if(r.dataset.done==="1") return;
    const id=r.dataset.ck;S.checks[id]=!S.checks[id];
    ls.s("ck",S.checks);renderChecklist();renderKpi();renderHoje();
  }));
}

            <div class="bag-text${m?" packed":""}" contenteditable="plaintext-only"
              data-gi="${gi}" data-ii="${ii}">${item}</div>
            <button class="bag-del" data-gi="${gi}" data-ii="${ii}">✕</button>
          </div>`;
        }).join("")}
        <button class="bag-add" data-gi="${gi}">+ ADICIONAR ITEM</button>
      </div>`).join("")}`;

  el.querySelectorAll("[data-bag]").forEach(dot=>{
    dot.addEventListener("click",()=>{
      const k=dot.dataset.bag;S.bag[k]=!S.bag[k];
      ls.s("bg",S.bag);renderBagagem();
    });
  });
  el.querySelectorAll(".bag-text").forEach(t=>{
    let tm;t.addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(()=>{
      S.bagItems[parseInt(t.dataset.gi)].items[parseInt(t.dataset.ii)]=t.textContent;
      ls.s("bagitems",S.bagItems);
    },400)});
  });
  el.querySelectorAll(".bag-del").forEach(btn=>{
    btn.addEventListener("click",()=>{
      S.bagItems[parseInt(btn.dataset.gi)].items.splice(parseInt(btn.dataset.ii),1);
      ls.s("bagitems",S.bagItems);renderBagagem();
    });
  });
  el.querySelectorAll(".bag-add").forEach(btn=>{
    btn.addEventListener("click",()=>{
      S.bagItems[parseInt(btn.dataset.gi)].items.push("Novo item");
      ls.s("bagitems",S.bagItems);renderBagagem();
    });
  });
}

/* ================================================================
   NAV + ROUTING
================================================================ */
const SCREEN_LABELS={
  hoje:"HOJE",agenda:"AGENDA",mapa:"MAPA",mais:"MAIS",
  checklist:"CHECKLIST",reservas:"RESERVAS",guia:"GUIA",
  hablando:"HABLANDO",bagagem:"BAGAGEM",info:"INFO"
};
const MAIN_SCREENS=new Set(["hoje","agenda","mapa","mais"]);

function goScreen(id){
  document.querySelectorAll(".p").forEach(p=>p.classList.remove("on"));
  document.getElementById(id).classList.add("on");
  document.querySelectorAll(".bnav-btn").forEach(b=>b.classList.remove("on"));
  const navId=MAIN_SCREENS.has(id)?id:"mais";
  document.querySelector(`.bnav-btn[data-p="${navId}"]`).classList.add("on");
  document.getElementById("hdr-screen-label").textContent=SCREEN_LABELS[id]||id.toUpperCase();
  window.scrollTo({top:0,behavior:"instant"});
}

function goSub(id){goScreen(id);}

function renderMais(){
  const items=[
    {id:"checklist",label:"Checklist",sub:"Compras pendentes e tarefas"},
    {id:"reservas",label:"Reservas",sub:"Hospedagens, transportes e documentos"},
    {id:"guia",label:"Guia",sub:"Lima, Cusco, Ollanta, AC, Puno, Arequipa"},
    {id:"hablando",label:"Hablando",sub:"Espanhol essencial para a viagem"},
    {id:"bagagem",label:"Bagagem",sub:"Lista com duplo check tenho / mala"},
    {id:"info",label:"Info",sub:"Voos, contatos e configurações"},
  ];
  document.getElementById("mais").innerHTML=`
    <div class="sh" style="margin-top:var(--sp-3)">SEÇÕES</div>
    <div class="mais-grid">
      ${items.map(it=>`
        <button class="mais-item" onclick="goSub('${it.id}')">
          <div>
            <div class="mais-item-label">${it.label}</div>
            <div class="mais-item-sub">${it.sub}</div>
          </div>
          <span class="mais-item-arr">→</span>
        </button>`).join("")}
    </div>`;
}

function addMaisBack(sectionId){
  const sec=document.getElementById(sectionId);
  if(!sec||sec.querySelector(".mais-back")) return;
  const btn=document.createElement("button");
  btn.className="mais-back";
  btn.innerHTML="← MAIS";
  btn.onclick=()=>goScreen("mais");
  sec.insertBefore(btn,sec.firstChild);
}

document.getElementById("bnav").addEventListener("click",e=>{
  const b=e.target.closest(".bnav-btn");if(!b) return;
  goScreen(b.dataset.p);
});

};
function tryShowSplash(city){
  if(!city||localStorage.getItem("arrived:"+city)) return;
  localStorage.setItem("arrived:"+city,"1");
  const el=document.getElementById("splash");
  document.getElementById("splash-city").textContent=city.toLowerCase();
  document.getElementById("splash-alt").textContent=CITY_ALT[city]||"";
  el.classList.remove("hidden");
  setTimeout(()=>{el.classList.add("hidden");},3000);
}

(async()=>{
  await load();
  renderMais();
  renderKpi();renderHoje();renderChecklist();
  renderAgenda();renderReservas();renderGuia();
  renderHablando();renderBagagem();renderInfo();

  updateSosHotel();
  /* add back buttons to subsections */
  ["checklist","reservas","guia","hablando","bagagem","info"].forEach(addMaisBack);
  setInterval(renderKpi,60000);
  document.getElementById("hdr-weather").addEventListener("click",updateHeaderWeather);
  /* Trip day counter in header */
  function updateTripDay(){
    const start=new Date("2026-06-28T00:00:00-03:00");
    const end=new Date("2026-07-12T23:59:00-03:00");
    const now=new Date();
    if(now<start){
      const d=Math.ceil((start-now)/864e5);
      document.getElementById("hdr-trip-day").textContent=`${d} dias para embarcar`;
    } else if(now<=end){
      const d=Math.floor((now-start)/864e5)+1;
      document.getElementById("hdr-trip-day").textContent=`dia ${d} de 15`;
    }
  }
  updateTripDay();
})();
</script>
