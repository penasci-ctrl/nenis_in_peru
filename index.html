<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#f7f7f5"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Peru"/>
<link rel="apple-touch-icon" sizes="180x180" href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Flag_of_Peru.svg/180px-Flag_of_Peru.svg.png"/>
<title>Peru · Pedro & Marina</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ── TOKENS ── */
:root{
  --bg:#f7f7f5;--bg-card:#fff;--bg-sunken:#f0efed;--bg-input:#f5f5f3;
  --ink:#1a1a1a;--ink-2:#3d3d3d;--ink-3:#6b6b6b;--ink-4:#9b9b9b;
  --line:#e0dfdd;--line-soft:#ebeae8;
  --c-tr:#2563eb;--c-tr-bg:#eff6ff;--c-tr-bd:#bfdbfe;
  --c-ac:#059669;--c-ac-bg:#ecfdf5;--c-ac-bd:#a7f3d0;
  --c-fd:#d97706;--c-fd-bg:#fffbeb;--c-fd-bd:#fde68a;
  --c-lo:#7c3aed;--c-lo-bg:#f5f3ff;--c-lo-bd:#c4b5fd;
  --c-al:#dc2626;--c-al-bg:#fef2f2;--c-al-bd:#fecaca;
  --c-in:#6b7280;--c-in-bg:#f3f4f6;--c-in-bd:#d1d5db;
  --green:#16a34a;--orange:#ea580c;--red:#dc2626;--blue:#2563eb;
  --r:14px;--r-sm:8px;--r-xs:5px;
  --sh:0 1px 3px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.05);
  --sh-md:0 4px 20px rgba(0,0,0,.07),0 0 0 .5px rgba(0,0,0,.05);
  --font:"DM Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:"DM Mono",ui-monospace,monospace;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111110;--bg-card:#1c1c1a;--bg-sunken:#151514;
  --ink:#ededeb;--ink-2:#c5c5c3;--ink-3:#8a8a88;--ink-4:#5a5a58;
  --line:#2a2a28;--line-soft:#222220;
  --c-tr:#60a5fa;--c-tr-bg:#1e293b;--c-tr-bd:#1e40af;
  --c-ac:#34d399;--c-ac-bg:#052e16;--c-ac-bd:#065f46;
  --c-fd:#fbbf24;--c-fd-bg:#451a03;--c-fd-bd:#92400e;
  --c-lo:#a78bfa;--c-lo-bg:#1e1035;--c-lo-bd:#4c1d95;
  --c-al:#f87171;--c-al-bg:#2d0a0a;--c-al-bd:#991b1b;
  --c-in:#9ca3af;--c-in-bg:#1f2023;--c-in-bd:#374151;
  --sh:0 1px 3px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.04);
  --sh-md:0 4px 20px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.04);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;background:none;border:0;outline:none}
a{color:var(--c-tr);text-decoration:none}
a:hover{text-decoration:underline}

/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:100;
  background:color-mix(in oklab,var(--bg) 82%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--line-soft)}
.hdr-in{max-width:760px;margin:0 auto;padding:14px 20px 10px;
  display:flex;align-items:center;gap:10px}
.hdr-flag{font-size:20px;line-height:1}
.hdr-title{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.hdr-weather{margin-left:auto;display:flex;align-items:center;gap:5px;
  font-size:12px;color:var(--ink-3);cursor:pointer;padding:4px 8px;
  border-radius:999px;transition:background .12s}
.hdr-weather:hover{background:var(--line-soft)}
.hdr-temp{font-weight:600;color:var(--ink-2);font-family:var(--mono);font-size:13px}
.hdr-loc{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-4)}
.hdr-skeleton{width:60px;height:14px;background:var(--line);border-radius:4px;
  animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── KPI ── */
.kpi{max-width:760px;margin:10px auto 0;padding:0 20px;
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kc{background:var(--bg-card);border-radius:var(--r-sm);padding:10px 12px;box-shadow:var(--sh)}
.kc-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-4)}
.kc-v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-family:var(--mono)}
.kc-v small{font-size:11px;font-weight:400;color:var(--ink-3);margin-left:2px;font-family:var(--font)}
.kc-u{background:var(--c-al-bg);border:.5px solid var(--c-al-bd)}
.kc-u .kc-l,.kc-u .kc-v{color:var(--c-al)}

/* ── TABS ── */
nav.tabs{max-width:760px;margin:14px auto 0;padding:0 20px;
  display:flex;gap:3px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 12px;border-radius:999px;font-size:11px;font-weight:700;
  color:var(--ink-4);text-transform:uppercase;letter-spacing:.07em;
  white-space:nowrap;transition:all .12s;flex-shrink:0}
.tab:hover{background:var(--line-soft)}
.tab.on{background:var(--ink);color:var(--bg)}

/* ── MAIN ── */
main{max-width:760px;margin:0 auto;padding:14px 20px 100px}
.p{display:none}.p.on{display:block;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.sh{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:var(--ink-4);margin:22px 0 7px;padding:0 2px}
.sh:first-child{margin-top:4px}
.card{background:var(--bg-card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.card+.card{margin-top:8px}

/* ── CHECKLIST ── */
.ck-row{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;
  border-bottom:.5px solid var(--line-soft);cursor:pointer;transition:background .1s}
.ck-row:last-child{border-bottom:0}
.ck-row:active{background:var(--bg-sunken)}
.ck-dot{flex:0 0 20px;width:20px;height:20px;border-radius:50%;
  border:1.5px solid var(--line);display:grid;place-items:center;
  transition:all .15s;margin-top:1px;flex-shrink:0}
.ck-dot.on{background:var(--green);border-color:var(--green)}
.ck-dot.on::after{content:"";width:9px;height:5px;border:2px solid #fff;
  border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ck-body{flex:1;min-width:0}
.ck-t{font-size:14px;font-weight:500;letter-spacing:-.008em}
.ck-t.on{color:var(--ink-4);text-decoration:line-through}
.ck-m{font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.4}
.ck-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.ck-dead{font-size:10px;font-weight:700;color:var(--c-al);margin-top:4px;
  text-transform:uppercase;letter-spacing:.04em}
.pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.04em}
.pu{background:var(--c-al-bg);color:var(--c-al);border:.5px solid var(--c-al-bd)}
.pw{background:var(--c-fd-bg);color:var(--c-fd);border:.5px solid var(--c-fd-bd)}
.pn{background:var(--c-in-bg);color:var(--c-in);border:.5px solid var(--c-in-bd)}

/* ── AGENDA ── */
.day{background:var(--bg-card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:10px}
.day-top{padding:13px 16px 11px;display:flex;align-items:baseline;gap:8px;border-bottom:.5px solid var(--line-soft)}
.d-num{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-4)}
.d-date{font-size:16px;font-weight:600;letter-spacing:-.01em;font-family:var(--mono)}
.d-city{font-size:11px;color:var(--ink-3);margin-left:auto;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.d-bday{display:inline-block;background:var(--c-fd-bg);border:.5px solid var(--c-fd-bd);
  border-radius:999px;padding:1px 8px;font-size:10px;color:var(--c-fd);
  font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-left:6px}
.d-title{font-size:13px;color:var(--ink-2);padding:8px 16px 4px;letter-spacing:-.005em;line-height:1.4;outline:none}
.d-title:focus{background:color-mix(in oklab,var(--c-tr) 5%,transparent)}

/* Period */
.period{border-top:1.5px solid var(--line)}
.period-h{padding:10px 16px 5px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);outline:none}
.period-h:focus{background:color-mix(in oklab,var(--c-tr) 5%,transparent)}

/* Event row — larger tap area */
.ev{display:flex;gap:10px;padding:11px 14px 11px 16px;
  align-items:flex-start;position:relative;cursor:pointer;
  transition:background .1s;border-bottom:.5px solid var(--line-soft)}
.ev:last-of-type{border-bottom:0}
.ev:active{background:var(--bg-sunken)}
.ev.dragging{opacity:.4;background:var(--bg-sunken)}
.ev.drag-over{border-top:2px solid var(--c-tr)}
.ev-handle{color:var(--ink-4);font-size:14px;cursor:grab;padding:2px 4px 2px 0;
  opacity:0;transition:opacity .12s;align-self:center;flex-shrink:0;touch-action:none}
.ev:hover .ev-handle{opacity:1}
.ev-stripe{width:3px;border-radius:2px;min-height:36px;flex-shrink:0;margin-top:2px}
.s-tr{background:var(--c-tr)}.s-ac{background:var(--c-ac)}
.s-fd{background:var(--c-fd)}.s-lo{background:var(--c-lo)}
.s-al{background:var(--c-al)}.s-in{background:var(--c-in)}
.ev-body{flex:1;min-width:0}
.ev-top{display:flex;align-items:baseline;gap:6px}
.ev-time{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  flex-shrink:0;min-width:44px;outline:none;border-radius:3px}
.ev-time:focus{background:color-mix(in oklab,var(--c-tr) 6%,transparent);padding:0 2px}
.ev-icon{font-size:13px;flex-shrink:0}
.ev-name{font-size:14px;font-weight:500;letter-spacing:-.01em;flex:1;outline:none;border-radius:3px}
.ev-name:focus{background:color-mix(in oklab,var(--c-tr) 6%,transparent);padding:0 2px}
.ev-desc{font-size:12px;color:var(--ink-3);line-height:1.6;
  padding:5px 0 2px;display:none;outline:none;border-radius:3px}
.ev-desc.open{display:block}
.ev-desc:focus{background:color-mix(in oklab,var(--c-tr) 6%,transparent);padding:4px;display:block}
.ev-chev{color:var(--ink-4);font-size:16px;transition:transform .15s;
  flex-shrink:0;padding:4px;margin:-4px;border-radius:50%;align-self:flex-start;margin-top:-2px}
.ev-chev.open{transform:rotate(90deg)}
.ev-actions{display:flex;gap:3px;margin-left:4px;align-items:flex-start}
.ev-del{width:24px;height:24px;border-radius:50%;font-size:11px;
  color:var(--ink-4);opacity:0;transition:all .12s;display:grid;place-items:center;flex-shrink:0}
.ev:hover .ev-del{opacity:1}
.ev-del:hover{color:var(--red);background:var(--c-al-bg)}
.ev-cat-sel{font-size:11px;padding:2px 4px;border-radius:4px;
  background:var(--bg-sunken);border:.5px solid var(--line);color:var(--ink-3);
  opacity:0;transition:opacity .12s;cursor:pointer}
.ev:hover .ev-cat-sel{opacity:1}
.sort-btn{display:flex;align-items:center;gap:5px;padding:5px 10px;
  margin:4px 16px 0;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink-4);border-radius:999px;
  background:var(--bg-sunken);transition:all .12s;width:fit-content}
.sort-btn:hover{color:var(--c-tr);background:var(--c-tr-bg)}
.ev-add{display:block;width:calc(100% - 32px);margin:8px 16px 12px;
  padding:8px;font-size:10px;font-weight:700;color:var(--ink-4);
  border-radius:var(--r-sm);border:.5px dashed var(--line);background:transparent;
  text-transform:uppercase;letter-spacing:.08em;transition:all .12s;text-align:center}
.ev-add:hover{background:var(--bg-sunken);color:var(--ink-2);border-color:var(--ink-4)}
.d-notes-lbl{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink-4);padding:0 16px;margin-top:6px;display:block}
.d-notes{display:block;width:calc(100% - 32px);margin:4px 16px 14px;
  padding:8px 10px;min-height:36px;resize:vertical;border-radius:var(--r-sm);
  background:var(--bg-sunken);border:.5px solid var(--line-soft);
  font-size:12px;color:var(--ink-2);transition:border-color .15s}
.d-notes:focus{border-color:var(--c-tr)}
.d-notes::placeholder{color:var(--ink-4)}

/* ── BAGAGEM ── */
.bag-progress{height:4px;background:var(--line-soft);border-radius:2px;
  margin-bottom:14px;overflow:hidden}
.bag-bar{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.bag-group-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bag-count{font-size:10px;color:var(--ink-4);margin-left:auto;font-family:var(--mono)}
.bag-row{display:flex;align-items:center;gap:10px;padding:11px 14px 11px 16px;
  border-bottom:.5px solid var(--line-soft)}
.bag-row:last-child{border-bottom:0}
.bag-checks{display:flex;gap:6px;flex-shrink:0}
.bag-check{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.bag-dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;transition:all .15s}
.bag-dot.tenho{background:var(--c-tr);border-color:var(--c-tr)}
.bag-dot.mala{background:var(--green);border-color:var(--green)}
.bag-dot.tenho::after,.bag-dot.mala::after{content:"";width:9px;height:5px;
  border:2px solid #fff;border-top:0;border-right:0;
  transform:rotate(-45deg) translate(1px,-1px)}
.bag-dot-lbl{font-size:8px;font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;color:var(--ink-4)}
.bag-text{flex:1;font-size:13px;font-weight:500;letter-spacing:-.008em;
  outline:none;border-radius:3px}
.bag-text:focus{background:color-mix(in oklab,var(--c-tr) 6%,transparent);padding:0 3px}
.bag-text.packed{color:var(--ink-4);text-decoration:line-through}
.bag-del{width:24px;height:24px;border-radius:50%;font-size:10px;
  color:var(--ink-4);opacity:0;transition:all .12s;display:grid;place-items:center}
.bag-row:hover .bag-del{opacity:1}
.bag-del:hover{color:var(--red);background:var(--c-al-bg)}
.bag-add{display:block;width:calc(100% - 32px);margin:6px 16px 12px;
  padding:8px;font-size:10px;font-weight:700;color:var(--ink-4);
  border-radius:var(--r-sm);border:.5px dashed var(--line);background:transparent;
  text-transform:uppercase;letter-spacing:.08em;transition:all .12s;text-align:center}
.bag-add:hover{background:var(--bg-sunken);color:var(--ink-2);border-color:var(--ink-4)}
.bag-legend{display:flex;gap:12px;margin-bottom:10px;padding:0 2px}
.bag-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3)}
.bag-legend-dot{width:12px;height:12px;border-radius:50%}

/* ── MAPA ── */
.map-wrap{border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-md)}
.map-frame{width:100%;height:420px;border:0;display:block}
.weather-strip{background:var(--bg-card);border-radius:var(--r);box-shadow:var(--sh);margin-top:10px}
.city-weather{display:flex;align-items:center;gap:10px;padding:11px 16px;
  border-bottom:.5px solid var(--line-soft)}
.city-weather:last-child{border-bottom:0}
.cw-city{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;flex:0 0 120px}
.cw-days{font-size:11px;color:var(--ink-4);flex:1}
.cw-data{display:flex;align-items:center;gap:6px}
.cw-icon{font-size:18px}
.cw-temp{font-size:14px;font-weight:600;font-family:var(--mono)}
.cw-skel{width:50px;height:14px;background:var(--line);border-radius:4px;animation:pulse 1.5s ease-in-out infinite}
.nav-btn{display:flex;align-items:center;gap:8px;padding:11px 14px;
  border-top:.5px solid var(--line-soft);cursor:pointer;transition:background .12s;
  text-decoration:none;color:var(--ink)}
.nav-btn:hover{background:var(--bg-sunken);text-decoration:none}
.nav-btn-icon{font-size:18px}
.nav-btn-text{font-size:13px;font-weight:500;flex:1}
.nav-btn-arr{color:var(--ink-4);font-size:16px}

/* ── RESERVAS ── */
.res-group{padding:12px 16px}
.res-group+.res-group{border-top:.5px solid var(--line-soft)}
.res-city{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4);margin-bottom:8px}
.res-row{display:grid;grid-template-columns:90px 1fr auto;gap:10px;padding:7px 0;align-items:start}
.res-row+.res-row{border-top:.5px solid var(--line-soft)}
.res-k{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);padding-top:2px}
.res-v{font-size:13px;line-height:1.3}
.res-v .sub{display:block;color:var(--ink-3);font-size:11px;margin-top:2px}
.res-s{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.s-ok{color:var(--green)}.s-pen{color:var(--orange)}.s-no{color:var(--red)}

/* ── HABLANDO ── */
.hab-section{margin-bottom:6px}
.hab-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;padding:3px 9px;border-radius:999px;margin-bottom:8px}
.htag-tr{background:var(--c-tr-bg);color:var(--c-tr)}
.htag-fd{background:var(--c-fd-bg);color:var(--c-fd)}
.htag-ac{background:var(--c-ac-bg);color:var(--c-ac)}
.htag-lo{background:var(--c-lo-bg);color:var(--c-lo)}
.htag-al{background:var(--c-al-bg);color:var(--c-al)}
.htag-in{background:var(--c-in-bg);color:var(--c-in)}
.ph-row{display:flex;gap:10px;padding:12px 14px;border-bottom:.5px solid var(--line-soft);align-items:flex-start}
.ph-row:last-child{border-bottom:0}
.ph-row:active{background:var(--bg-sunken)}
.ph-body{flex:1}
.ph-es{font-size:15px;font-weight:500;letter-spacing:-.01em;color:var(--ink)}
.ph-pt{font-size:12px;color:var(--ink-3);margin-top:3px}
.ph-pron{font-size:11px;color:var(--ink-4);margin-top:2px;font-style:italic}
.ph-hear{font-size:11px;color:var(--c-ac);margin-top:3px;font-style:italic}
.ph-copy{font-size:11px;color:var(--ink-4);padding:5px 8px;border-radius:var(--r-xs);
  flex-shrink:0;transition:all .12s;font-weight:600;background:var(--bg-sunken)}
.ph-copy:hover{background:var(--c-tr-bg);color:var(--c-tr)}
.ph-copy.copied{color:var(--green);background:var(--c-ac-bg)}
.pegadinha{background:var(--c-fd-bg);border:.5px solid var(--c-fd-bd);
  border-radius:var(--r-sm);padding:11px 14px;margin-bottom:8px;line-height:1.5}
.pegadinha strong{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--c-fd);display:block;margin-bottom:3px}
.pegadinha p{font-size:12px;color:var(--ink-2)}

/* ── GUIA ── */
.guia-city{background:var(--bg-card);border-radius:var(--r);box-shadow:var(--sh);
  overflow:hidden;margin-bottom:10px}
.guia-header{padding:16px;background:var(--ink);color:var(--bg)}
.guia-city-name{font-size:20px;font-weight:700;letter-spacing:-.015em}
.guia-tagline{font-size:12px;opacity:.65;margin-top:3px;font-style:italic}
.guia-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

let wCache={};
async function fetchW(lat,lon){
  const k=`${lat},${lon}`;if(wCache[k]) return wCache[k];
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&forecast_days=1&timezone=auto`);
    const j=await r.json();
    const res={temp:Math.round(j.current.temperature_2m),icon:wIcon(j.current.weather_code)};
    wCache[k]=res;return res;
  }catch{return null}
}
function wIcon(c){
  if(c===0)return"☀️";if(c<=2)return"🌤️";if(c<=3)return"☁️";
  if(c<=48)return"🌫️";if(c<=67)return"🌧️";if(c<=77)return"🌨️";
  if(c<=82)return"🌧️";if(c<=99)return"⛈️";return"🌡️";
}
async function updateHeaderWeather(){
  const now=new Date();
  let city=CITY_WEATHER[0];
  if(now>=CFG.TRIP_START){
    const day=Math.floor((now-CFG.TRIP_START)/864e5)+1;
    const ag=AGENDA_DEFAULT.find(d=>d.d===day);
    if(ag){
      const nm=ag.city.split("→")[0].trim().toUpperCase();
      const m=CITY_WEATHER.find(c=>nm.includes(c.city.toUpperCase()));
      if(m) city=m;
    }
  }
  const w=await fetchW(city.lat,city.lon);
  const ti=document.getElementById("hdr-icon");
  const tt=document.getElementById("hdr-temp");
  const tl=document.getElementById("hdr-loc");
  if(w){ti.textContent=w.icon;tt.textContent=w.temp+"°C";tl.textContent=city.city.toUpperCase();}
  else{ti.textContent="";tt.textContent="—";tl.textContent="";}
}

/* ================================================================
   AGENDA HELPERS
================================================================ */
function getDay(d){
  const base=AGENDA_DEFAULT.find(x=>x.d===d);if(!base) return null;
  const ov=S.agenda[d]||{};
  const out={d:base.d,date:ov.date??base.date,city:ov.city??base.city,
    title:ov.title??base.title,bday:base.bday,periods:[]};
  const bps=base.periods,ops=ov.periods||[];
  const len=Math.max(bps.length,ops.length);
  for(let pi=0;pi<len;pi++){
    const bp=bps[pi]||{p:"",evs:[]},op=ops[pi]||{};
    const period={p:op.p??bp.p,evs:[]};
    const bes=bp.evs||[],oes=op.evs||[];
    for(let ei=0;ei<Math.max(bes.length,oes.length);ei++){
      const be=bes[ei]||{t:"",n:"",d:"",c:"info"},oe=oes[ei]||{};
      period.evs.push({t:oe.t??be.t,n:oe.n??be.n,d:oe.d??be.d,c:oe.c??be.c});
    }
    out.periods.push(period);
  }
  return out;
}
function saveAgenda(d,patch){S.agenda[d]={...(S.agenda[d]||{}),...patch};ls.s("ag",S.agenda)}
function savePeriods(d,periods){S.agenda[d]={...(S.agenda[d]||{}),periods};ls.s("ag",S.agenda)}

function parseTime(t){
  const s=String(t||"").trim();
  const m=s.match(/(\d{1,2})[:\.](\d{2})/);
  if(m) return parseInt(m[1])*60+parseInt(m[2]);
  return 9999; // no parseable time → end
}
function sortEvsByTime(evs){
  return [...evs].sort((a,b)=>parseTime(a.t)-parseTime(b.t));
}

function serializeDay(dayEl){
  const periods=[];
  dayEl.querySelectorAll(".period").forEach(p=>{
    const ph=p.querySelector(".period-h");
    const evs=[];
    p.querySelectorAll(".ev").forEach(e=>{
      evs.push({
        t:e.querySelector(".ev-time").textContent.trim(),
        n:e.querySelector(".ev-name").textContent.trim(),
        d:e.querySelector(".ev-desc")?.textContent.trim()||"",
        c:e.dataset.cat||"info",
      });
    });
    periods.push({p:ph?ph.textContent.trim():"",evs});
  });
  return periods;
}

/* ================================================================
   DRAG AND DROP
================================================================ */
let dragSrc=null;
function initDrag(evEl,dayEl,dayNum){
  evEl.setAttribute("draggable","true");
  evEl.querySelector(".ev-handle").style.display="flex";

  evEl.addEventListener("dragstart",e=>{
    dragSrc=evEl;evEl.classList.add("dragging");
    e.dataTransfer.effectAllowed="move";
  });
  evEl.addEventListener("dragend",()=>{
    evEl.classList.remove("dragging");
    dayEl.querySelectorAll(".ev").forEach(el=>el.classList.remove("drag-over"));
    // auto-sort after drop
    const periods=serializeDay(dayEl);
    periods.forEach(p=>{p.evs=sortEvsByTime(p.evs)});
    savePeriods(dayNum,periods);
    renderAgendaDay(dayEl,dayNum);
  });
  evEl.addEventListener("dragover",e=>{
    e.preventDefault();e.dataTransfer.dropEffect="move";
    if(dragSrc&&dragSrc!==evEl){
      dayEl.querySelectorAll(".ev").forEach(el=>el.classList.remove("drag-over"));
      evEl.classList.add("drag-over");
    }
  });
  evEl.addEventListener("drop",e=>{
    e.preventDefault();
    if(dragSrc&&dragSrc!==evEl){
      const parent=evEl.parentNode;
      parent.insertBefore(dragSrc,evEl);
      evEl.classList.remove("drag-over");
    }
  });
}

================================================================ */
const CATS_OPTS=CATS.map(k=>`<option value="${k}">${CAT[k].i} ${k}</option>`).join("");

function makeEvEl(ev,dayNum){
  const cat=CAT[ev.c]||CAT.info;
  const div=document.createElement("div");
  div.className="ev";div.dataset.cat=ev.c;
  div.innerHTML=`
    <span class="ev-handle" style="display:none;align-items:center">⠿</span>
    <div class="ev-stripe ${cat.s}"></div>
    <div class="ev-body">
      <div class="ev-top">
        <span class="ev-time" contenteditable="plaintext-only">${ev.t}</span>
        <span class="ev-icon">${cat.i}</span>
        <span class="ev-name" contenteditable="plaintext-only">${ev.n}</span>
      </div>
      <div class="ev-desc${ev.d?" open":""}" contenteditable="plaintext-only">${ev.d||""}</div>
    </div>
    <div class="ev-actions">
      <select class="ev-cat-sel">${CATS_OPTS}</select>
      <button class="ev-del" title="Remover">✕</button>
    </div>
    <span class="ev-chev${ev.d?" open":""}">›</span>`;
  div.querySelector(".ev-cat-sel").value=ev.c;
  return div;
}

function renderAgendaDay(dayEl,dayNum){
  const day=getDay(dayNum);if(!day) return;
  const periodsContainer=dayEl.querySelector(".periods-wrap");
  if(!periodsContainer) return;
  periodsContainer.innerHTML="";
  day.periods.forEach((per,pi)=>{
    const pDiv=document.createElement("div");
    pDiv.className="period";pDiv.dataset.pi=pi;
    pDiv.innerHTML=`<div class="period-h" contenteditable="plaintext-only">${per.p}</div>`;
    per.evs.forEach(e=>{
      const evEl=makeEvEl(e,dayNum);
      pDiv.appendChild(evEl);
      initDrag(evEl,dayEl,dayNum);
    });
    // Sort button
    const sb=document.createElement("button");
    sb.className="sort-btn";sb.textContent="↑↓ Ordenar por horário";sb.dataset.pi=pi;
    // Add button
    const ab=document.createElement("button");
    ab.className="ev-add";ab.textContent="+ ADICIONAR ITEM";ab.dataset.pi=pi;
    periodsContainer.appendChild(pDiv);
    periodsContainer.appendChild(sb);
    periodsContainer.appendChild(ab);
  });
  bindDayEl(dayEl,dayNum);
}

function bindDayEl(dayEl,dayNum){
  const autoSave=()=>{
    const periods=serializeDay(dayEl);savePeriods(dayNum,periods);
  };
  dayEl.querySelectorAll("[contenteditable]").forEach(el=>{
    el.addEventListener("blur",autoSave);
  });
  dayEl.querySelector(".d-title")?.addEventListener("blur",e=>{
    saveAgenda(dayNum,{title:e.target.textContent.trim()});
  });
  dayEl.querySelector(".d-date")?.addEventListener("blur",e=>{
    saveAgenda(dayNum,{date:e.target.textContent.trim()});
  });
  dayEl.querySelector(".d-city")?.addEventListener("blur",e=>{
    saveAgenda(dayNum,{city:e.target.textContent.trim()});
  });

  dayEl.querySelectorAll(".ev").forEach(evEl=>{
    // chev + tap to expand
    const chev=evEl.querySelector(".ev-chev");
    const desc=evEl.querySelector(".ev-desc");
    chev.addEventListener("click",e=>{
      e.stopPropagation();
      desc.classList.toggle("open");chev.classList.toggle("open");
    });
    evEl.addEventListener("click",e=>{
      if(e.target.closest("[contenteditable]")||e.target.closest("select")||
         e.target.closest(".ev-del")||e.target.closest(".ev-chev")||
         e.target.closest(".ev-handle")) return;
      desc.classList.toggle("open");chev.classList.toggle("open");
    });
    // cat select
    const sel=evEl.querySelector(".ev-cat-sel");
    sel.addEventListener("change",()=>{
      const c=sel.value;evEl.dataset.cat=c;const cat=CAT[c]||CAT.info;
      evEl.querySelector(".ev-stripe").className=`ev-stripe ${cat.s}`;
      evEl.querySelector(".ev-icon").textContent=cat.i;
      autoSave();
    });
    // delete
    evEl.querySelector(".ev-del").addEventListener("click",e=>{
      e.stopPropagation();evEl.remove();autoSave();
    });
    // drag
    initDrag(evEl,dayEl,dayNum);
  });

  // Sort buttons
  dayEl.querySelectorAll(".sort-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const pi=parseInt(btn.dataset.pi);
      const periods=serializeDay(dayEl);
      if(periods[pi]) periods[pi].evs=sortEvsByTime(periods[pi].evs);
      savePeriods(dayNum,periods);
      renderAgendaDay(dayEl,dayNum);
    });
  });

  // Add buttons
  dayEl.querySelectorAll(".ev-add").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const pi=parseInt(btn.dataset.pi);
      const periods=serializeDay(dayEl);
      if(!periods[pi]) return;
      periods[pi].evs.push({t:"Horário",n:"Novo item",d:"Descrição",c:"info"});
      savePeriods(dayNum,periods);
      renderAgendaDay(dayEl,dayNum);
    });
  });

  // Notes
  const ta=dayEl.querySelector(".d-notes");
  if(ta){let t;ta.addEventListener("input",()=>{
    clearTimeout(t);t=setTimeout(()=>{S.notes[dayNum]=ta.value;ls.s("nt",S.notes)},400);
  });}
}

    <div class="weather-strip" id="weather-cities">
      ${CITY_WEATHER.map(c=>`
        <div class="city-weather">
          <div class="cw-city">${c.city}</div>
          <div class="cw-days">${c.days}</div>
          <div class="cw-data" id="cw-${c.city}">
            <span class="cw-skel"></span>
          </div>
          <a href="${c.maps}" target="_blank" rel="noopener"
            style="font-size:11px;color:var(--c-tr);font-weight:600;white-space:nowrap;margin-left:8px">Navegar ›</a>
        </div>`).join("")}
    </div>`;
  CITY_WEATHER.forEach(c=>{
    fetchW(c.lat,c.lon).then(w=>{
      const el=document.getElementById(`cw-${c.city}`);
      if(!el) return;
      el.innerHTML=w?`<span class="cw-icon">${w.icon}</span><span class="cw-temp">${w.temp}°C</span>`:`<span style="font-size:12px;color:var(--ink-4)">—</span>`;
    });
  });
}

  el.querySelectorAll(".ph-copy").forEach(btn=>{

}

function renderBagagem(){
  const el=document.getElementById("bagagem");
  const items=S.bagItems||BAG_DEFAULT.map(g=>({...g,items:[...g.items]}));
  S.bagItems=items;
  const total=items.reduce((s,g)=>s+g.items.length,0);
  const temTotal=items.reduce((s,g,gi)=>s+g.items.filter((_,ii)=>S.bag[`${gi}-${ii}-t`]).length,0);
  const malaTotal=items.reduce((s,g,gi)=>s+g.items.filter((_,ii)=>S.bag[`${gi}-${ii}-m`]).length,0);

  el.innerHTML=`
    <div class="bag-legend">
      <div class="bag-legend-item"><div class="bag-legend-dot" style="background:var(--c-tr)"></div>TENHO</div>
      <div class="bag-legend-item"><div class="bag-legend-dot" style="background:var(--green)"></div>NA MALA</div>
    </div>
    <div class="bag-progress"><div class="bag-bar" style="width:${total?Math.round(malaTotal/total*100):0}%"></div></div>
    <div style="font-size:11px;color:var(--ink-4);margin-bottom:14px;font-family:var(--mono)">
      ${temTotal}/${total} tenho · ${malaTotal}/${total} na mala
    </div>
    ${items.map((g,gi)=>`
      <div class="sh"><span style="margin-right:6px">${g.ico}</span>${g.g}</div>
      <div class="card">
        ${g.items.map((item,ii)=>{
          const kt=`${gi}-${ii}-t`,km=`${gi}-${ii}-m`;
          const t=!!S.bag[kt],m=!!S.bag[km];
          return`<div class="bag-row" data-gi="${gi}" data-ii="${ii}">
            <div class="bag-checks">
              <div class="bag-check" data-bag="${kt}" title="Tenho este item">
                <div class="bag-dot${t?" tenho":""}"></div>
                <span class="bag-dot-lbl">TENHO</span>
              </div>
              <div class="bag-check" data-bag="${km}" title="Já na mala">
                <div class="bag-dot${m?" mala":""}"></div>
                <span class="bag-dot-lbl">MALA</span>
              </div>
            </div>
            <div class="bag-text${m?" packed":""}" contenteditable="plaintext-only"
              data-gi="${gi}" data-ii="${ii}">${item}</div>
            <button class="bag-del" data-gi="${gi}" data-ii="${ii}">✕</button>
          </div>`;
        }).join("")}
        <button class="bag-add" data-gi="${gi}">+ ADICIONAR ITEM</button>
      </div>`).join("")}`;

  el.querySelectorAll("[data-bag]").forEach(dot=>{
    dot.addEventListener("click",()=>{
      const k=dot.dataset.bag;S.bag[k]=!S.bag[k];
      ls.s("bg",S.bag);renderBagagem();
    });
  });
  el.querySelectorAll(".bag-text").forEach(t=>{
    let tm;t.addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(()=>{
      S.bagItems[parseInt(t.dataset.gi)].items[parseInt(t.dataset.ii)]=t.textContent;
      ls.s("bagitems",S.bagItems);
    },400)});
  });
  el.querySelectorAll(".bag-del").forEach(btn=>{
    btn.addEventListener("click",()=>{
      S.bagItems[parseInt(btn.dataset.gi)].items.splice(parseInt(btn.dataset.ii),1);
      ls.s("bagitems",S.bagItems);renderBagagem();
    });
  });
  el.querySelectorAll(".bag-add").forEach(btn=>{
    btn.addEventListener("click",()=>{
      S.bagItems[parseInt(btn.dataset.gi)].items.push("Novo item");
      ls.s("bagitems",S.bagItems);renderBagagem();
    });
  });
}
