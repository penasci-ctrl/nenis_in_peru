<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f7f5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Peru" />
<link rel="apple-touch-icon" sizes="180x180" href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Flag_of_Peru.svg/180px-Flag_of_Peru.svg.png" />
<title>Peru · Pedro & Marina</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f7f7f5; --bg-card: #ffffff; --bg-sunken: #f0efed;
  --ink: #1a1a1a; --ink-2: #3d3d3d; --ink-3: #6b6b6b; --ink-4: #9b9b9b;
  --line: #e0dfdd; --line-soft: #ebeae8;
  --transport: #2563eb; --transport-bg: #eff6ff; --transport-border: #bfdbfe;
  --activity: #059669; --activity-bg: #ecfdf5; --activity-border: #a7f3d0;
  --food: #d97706; --food-bg: #fffbeb; --food-border: #fde68a;
  --lodge: #7c3aed; --lodge-bg: #f5f3ff; --lodge-border: #c4b5fd;
  --alert: #dc2626; --alert-bg: #fef2f2; --alert-border: #fecaca;
  --info: #6b7280; --info-bg: #f3f4f6; --info-border: #d1d5db;
  --green: #16a34a; --orange: #ea580c; --red: #dc2626;
  --radius: 14px; --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.04), 0 0 0 0.5px rgba(0,0,0,.05);
  --font: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: "DM Mono", ui-monospace, monospace;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111110;--bg-card:#1c1c1a;--bg-sunken:#151514;
  --ink:#ededeb;--ink-2:#c5c5c3;--ink-3:#8a8a88;--ink-4:#5a5a58;
  --line:#2a2a28;--line-soft:#222220;
  --transport-bg:#1e293b;--transport-border:#1e40af;--transport:#60a5fa;
  --activity-bg:#052e16;--activity-border:#065f46;--activity:#34d399;
  --food-bg:#451a03;--food-border:#92400e;--food:#fbbf24;
  --lodge-bg:#1e1035;--lodge-border:#4c1d95;--lodge:#a78bfa;
  --alert-bg:#2d0a0a;--alert-border:#991b1b;--alert:#f87171;
  --info-bg:#1f2023;--info-border:#374151;--info:#9ca3af;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.04);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}

/* Header */
.hdr{position:sticky;top:0;z-index:50;background:color-mix(in oklab,var(--bg) 85%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line-soft)}
.hdr-in{max-width:760px;margin:0 auto;padding:16px 20px 12px;display:flex;align-items:baseline;gap:12px}
.hdr h1{font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.hdr .flag{font-size:18px;margin-right:2px}
.hdr .sub{color:var(--ink-3);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}

/* Countdown */
.kpi{max-width:760px;margin:12px auto 0;padding:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi-card{background:var(--bg-card);border-radius:var(--radius-sm);padding:12px 14px;box-shadow:var(--shadow)}
.kpi-card .l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.kpi-card .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.kpi-card .v small{font-size:12px;font-weight:400;color:var(--ink-3);margin-left:3px}

/* Tabs */
nav.tabs{max-width:760px;margin:16px auto 0;padding:0 20px;display:flex;gap:3px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;transition:all .12s ease}
.tab:hover{background:var(--line-soft)}
.tab.on{background:var(--ink);color:var(--bg)}

/* Main */
main{max-width:760px;margin:0 auto;padding:16px 20px 100px}
.p{display:none}.p.on{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* Section heading */
.sh{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4);margin:24px 0 8px;padding:0 2px}
.sh:first-child{margin-top:4px}

/* Card */
.card{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:8px}

/* ─── CHECKLIST ─── */
.ck-row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:.5px solid var(--line-soft);cursor:pointer;transition:background .1s}
.ck-row:last-child{border-bottom:0}
.ck-row:active{background:var(--bg-sunken)}
.ck-dot{flex:0 0 20px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:all .15s;margin-top:1px}
.ck-dot.on{background:var(--green);border-color:var(--green)}
.ck-dot.on::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ck-body{flex:1;min-width:0}
.ck-t{font-size:14px;font-weight:500;letter-spacing:-.008em}.ck-t.on{color:var(--ink-4);text-decoration:line-through}
.ck-m{font-size:12px;color:var(--ink-3);margin-top:2px}
.ck-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.pill{font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.pill-urgent{background:var(--alert-bg);color:var(--alert);border:.5px solid var(--alert-border)}
.pill-warn{background:var(--food-bg);color:var(--food);border:.5px solid var(--food-border)}
.pill-ok{background:var(--activity-bg);color:var(--activity);border:.5px solid var(--activity-border)}
.pill-neutral{background:var(--info-bg);color:var(--info);border:.5px solid var(--info-border)}

/* ─── AGENDA ─── */
.day{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:10px}
.day-top{padding:14px 16px 12px;display:flex;align-items:baseline;gap:8px;border-bottom:.5px solid var(--line-soft)}
.day-num{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-4)}
.day-date{font-size:16px;font-weight:600;letter-spacing:-.01em}
.day-city{font-size:12px;color:var(--ink-3);margin-left:auto;text-transform:uppercase;letter-spacing:.04em;font-weight:500}
.day-title{font-size:13px;color:var(--ink-2);padding:0 16px;margin:8px 0 4px;letter-spacing:-.005em}
.day-bday{display:inline-block;background:var(--food-bg);border:.5px solid var(--food-border);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--food);font-weight:600;margin-left:4px}

/* Period blocks */
.period{border-top:.5px solid var(--line-soft)}
.period:first-of-type{border-top:0}
.period-head{padding:10px 16px 6px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)}

/* Event item */
.ev{display:flex;gap:10px;padding:8px 16px;cursor:pointer;transition:background .1s ease;align-items:flex-start}
.ev:active{background:var(--bg-sunken)}
.ev-stripe{width:3px;border-radius:2px;min-height:32px;flex-shrink:0;margin-top:2px}
.ev-stripe.transport{background:var(--transport)}
.ev-stripe.activity{background:var(--activity)}
.ev-stripe.food{background:var(--food)}
.ev-stripe.lodge{background:var(--lodge)}
.ev-stripe.alert{background:var(--alert)}
.ev-stripe.info{background:var(--info)}
.ev-body{flex:1;min-width:0}
.ev-head{display:flex;align-items:baseline;gap:8px}
.ev-time{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:0 0 auto;min-width:44px}
.ev-name{font-size:13px;font-weight:500;letter-spacing:-.005em}
.ev-cat-icon{font-size:12px;flex-shrink:0}
.ev-desc{font-size:12px;color:var(--ink-3);line-height:1.5;padding:4px 0 6px 0;display:none;letter-spacing:-.005em}
.ev-desc.open{display:block;animation:fadeIn .15s ease}
.ev-chevron{color:var(--ink-4);font-size:14px;transition:transform .15s ease;margin-top:2px;flex-shrink:0}
.ev-chevron.open{transform:rotate(90deg)}

/* Day notes */
.day-notes{width:calc(100% - 32px);margin:8px 16px 14px;padding:8px 10px;min-height:36px;resize:vertical;border-radius:var(--radius-sm);background:var(--bg-sunken);border:.5px solid var(--line-soft);font-size:12px;color:var(--ink-2);outline:none;transition:border-color .15s}
.day-notes:focus{border-color:var(--ink-3)}
.day-notes::placeholder{color:var(--ink-4)}

/* Edit controls */
.ev-edit{display:flex;gap:4px;margin-left:auto}
.ev-del{width:20px;height:20px;border-radius:50%;font-size:10px;color:var(--ink-4);opacity:0;transition:all .12s}
.ev:hover .ev-del{opacity:1}
.ev-del:hover{color:var(--red);background:var(--alert-bg)}
.ev-add{display:block;width:calc(100% - 32px);margin:4px 16px 12px;padding:6px;font-size:11px;color:var(--ink-4);border-radius:var(--radius-sm);border:.5px dashed var(--line);background:transparent;text-transform:uppercase;letter-spacing:.06em;font-weight:600;transition:all .12s}
.ev-add:hover{background:var(--bg-sunken);color:var(--ink-2);border-color:var(--ink-4)}

/* Editable inline */
[contenteditable="plaintext-only"]{outline:none;border-radius:3px;transition:background .12s,box-shadow .12s}
[contenteditable="plaintext-only"]:focus{background:color-mix(in oklab,var(--transport) 8%,transparent);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--transport) 25%,transparent)}

/* ─── RESERVAS ─── */
.res-group{padding:14px 16px}
.res-group+.res-group{border-top:.5px solid var(--line-soft)}
.res-city{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4);margin-bottom:8px}
.res-row{display:grid;grid-template-columns:88px 1fr auto;gap:10px;padding:8px 0;align-items:baseline}
.res-row+.res-row{border-top:.5px solid var(--line-soft)}
.res-k{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;font-weight:500}
.res-v{font-size:13px}.res-v .sub{display:block;color:var(--ink-3);font-size:11px;margin-top:2px}
.res-s{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.s-ok{color:var(--green)}.s-pen{color:var(--orange)}.s-no{color:var(--red)}
@media(prefers-color-scheme:dark){.s-ok{color:#4ade80}.s-pen{color:#fb923c}.s-no{color:#f87171}}
.res-link{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:11px;color:var(--transport);text-decoration:none;font-weight:500}
.res-link:hover{text-decoration:underline}

/* ─── MAP ─── */
.map-wrap{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:var(--bg-card)}
.map-frame{width:100%;height:420px;border:0}
.map-legend{padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px}
.map-leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2);font-weight:500}
.map-leg-dot{width:8px;height:8px;border-radius:50%}

/* ─── INFO ─── */
.info-row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:.5px solid var(--line-soft)}
.info-row:last-child{border-bottom:0}

/* Mobile */
@media(max-width:600px){
  .hdr-in,.kpi,nav.tabs,main{padding-left:14px;padding-right:14px}
  .res-row{grid-template-columns:72px 1fr;}.res-s{grid-column:2}
  .map-frame{height:320px}
}
</style>
</head>
<body>

<header class="hdr"><div class="hdr-in">
  <h1><span class="flag">🇵🇪</span> PERU</h1>
  <div class="sub" id="countdown-label"></div>
</div></header>

<div class="kpi" id="kpi"></div>

<nav class="tabs" id="tabs">
  <button class="tab on" data-p="checklist">Checklist</button>
  <button class="tab" data-p="agenda">Agenda</button>
  <button class="tab" data-p="reservas">Reservas</button>
  <button class="tab" data-p="mapa">Mapa</button>
  <button class="tab" data-p="info">Info</button>
</nav>

<main>
  <section id="checklist" class="p on"></section>
  <section id="agenda" class="p"></section>
  <section id="reservas" class="p"></section>
  <section id="mapa" class="p"></section>
  <section id="info" class="p"></section>
</main>

<script>

    { id:"c-t2", t:"Trem Machu Picchu → Cusco (volta)", m:"The Voyager · 14:30→18:20 · 06/jul · Inca Rail · USD 119/pax", tags:[["URGENTE","urgent"],["incarail.com","neutral"]]},

================================================================ */

  { d:5, date:"QUI 02/JUL", city:"CUSCO → OLLANTA", title:"Aniversário da Marina 🎂", bday:true, periods:[

      ev("Cedo","🎂 Feliz aniversário, Marina!","Momento especial antes do check-out — café mais calmo, presentinho, foto na Plaza de Armas ainda vazia.","bday"),

/* ================================================================
   STATE
================================================================ */
const state = { checks:{}, notes:{}, edits:{} };
async function sGet(k,f){try{const r=localStorage.getItem(k);return r?JSON.parse(r):f}catch{return f}}
async function sSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
async function load(){state.checks=await sGet("ck",{});state.notes=await sGet("nt",{});state.edits=await sGet("ed",{})}

/* ================================================================
   RENDER: KPI
================================================================ */
function renderKpi(){
  const now=new Date(), diff=TRIP-now, days=Math.max(0,Math.floor(diff/(864e5)));
  document.getElementById("countdown-label").textContent = days > 0 ? `EM ${days} DIAS` : days === 0 ? "HOJE!" : `DIA ${-days+1}`;
  let pend=0; CHECKLIST.forEach(g=>{if(!g.done) g.items.forEach(i=>{if(!state.checks[i.id]) pend++})});
  document.getElementById("kpi").innerHTML=`
    <div class="kpi-card"><div class="l">FALTAM</div><div class="v">${days}<small>dias</small></div></div>
    <div class="kpi-card"><div class="l">PENDENTES</div><div class="v">${pend}<small>itens</small></div></div>`;
}

/* ================================================================
   RENDER: CHECKLIST
================================================================ */
function renderChecklist(){
  const el=document.getElementById("checklist");
  el.innerHTML=CHECKLIST.map(g=>`
    <div class="sh">${g.group}</div><div class="card">${g.items.map(i=>{
      const on=g.done||state.checks[i.id];
      return `<div class="ck-row" data-ck="${i.id}" data-grp="${g.done?1:0}">
        <div class="ck-dot${on?" on":""}"></div>
        <div class="ck-body">
          <div class="ck-t${on?" on":""}">${i.t}</div>
          ${i.m?`<div class="ck-m">${i.m}</div>`:""}
          ${i.tags?`<div class="ck-tags">${i.tags.map(([t,k])=>`<span class="pill pill-${k}">${t}</span>`).join("")}</div>`:""}
        </div>
      </div>`;
    }).join("")}</div>`).join("");
  el.querySelectorAll("[data-ck]").forEach(r=>r.addEventListener("click",async()=>{
    if(r.dataset.grp==="1") return;
    const id=r.dataset.ck; state.checks[id]=!state.checks[id];
    await sSet("ck",state.checks); renderChecklist(); renderKpi();
  }));
}

/* ================================================================
   RENDER: AGENDA
================================================================ */
function getMerged(day){
  const e=state.edits[day.d]||{};
  const b={...day, periods:day.periods.map(p=>({...p, evs:p.evs.map(v=>({...v}))}))};
  if(e.title!==undefined) b.title=e.title;
  if(e.periods) b.periods=e.periods;
  return b;
}

function renderAgenda(){
  const el=document.getElementById("agenda");
  el.innerHTML=AGENDA.map(raw=>{
    const day=getMerged(raw);
    return `
    <div class="day" data-day="${day.d}">
      <div class="day-top">
        <span class="day-num">DIA ${day.d}</span>
        <span class="day-date">${day.date}</span>
        <span class="day-city">${day.city}</span>
      </div>
      <div class="day-title" contenteditable="plaintext-only" data-field="title">${day.title}${day.bday?'<span class="day-bday">ANIVERSÁRIO</span>':''}</div>
      ${day.periods.map((per,pi)=>`
        <div class="period" data-period="${pi}">
          <div class="period-head">${per.p}</div>
          ${per.evs.map((e,ei)=>{
            const cat=C[e.c]||C.info;
            return `
            <div class="ev" data-ev="${pi}-${ei}">
              <div class="ev-stripe ${cat.stripe}"></div>
              <div class="ev-body">
                <div class="ev-head">
                  <span class="ev-time">${e.t}</span>
                  <span class="ev-cat-icon">${cat.icon}</span>
                  <span class="ev-name">${e.n}</span>
                </div>
                <div class="ev-desc">${e.d||""}</div>
              </div>
              <span class="ev-chevron">›</span>
            </div>`;
          }).join("")}
        </div>
      `).join("")}
      <button class="ev-add" data-add="${day.d}">+ ADICIONAR ITEM</button>
      <textarea class="day-notes" data-note="${day.d}" placeholder="Anotações do dia…">${state.notes[day.d]||""}</textarea>
    </div>`;
  }).join("");

  // Collapse toggle
  el.querySelectorAll(".ev").forEach(e=>e.addEventListener("click",()=>{
    const desc=e.querySelector(".ev-desc"), chev=e.querySelector(".ev-chevron");
    desc.classList.toggle("open"); chev.classList.toggle("open");
  }));
  // Notes save
  el.querySelectorAll("[data-note]").forEach(ta=>{let t;ta.addEventListener("input",()=>{
    clearTimeout(t);t=setTimeout(async()=>{state.notes[ta.dataset.note]=ta.value;await sSet("nt",state.notes)},400);
  })});
  // Title edit
  el.querySelectorAll("[data-field='title']").forEach(t=>{let d;t.addEventListener("input",()=>{
    clearTimeout(d);d=setTimeout(async()=>{
      const dn=parseInt(t.closest(".day").dataset.day);
      state.edits[dn]={...(state.edits[dn]||{}),title:t.textContent};await sSet("ed",state.edits);
    },400);
  })});
}

/* ================================================================
   RENDER: MAP (Leaflet embed via iframe with OpenStreetMap)
================================================================ */
function renderMap(){
  const el=document.getElementById("mapa");
  // Build a simple Leaflet map in an iframe blob
  const markers = PINS.map(p=>`
    L.marker([${p.lat},${p.lng}],{icon:L.divIcon({html:'<div style="font-size:24px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))">${p.emoji}</div>',className:'',iconSize:[30,30],iconAnchor:[15,15]})})
      .addTo(map).bindPopup('<b>${p.label}</b><br>Dia ${p.d}');
  `).join("\n");
  
  const route = PINS.map(p=>`[${p.lat},${p.lng}]`).join(",");
  
  const mapHtml = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>
    <style>html,body,#map{margin:0;height:100%;width:100%;background:#f0efed}</style>
  </head><body><div id="map"></div><script>
    const map=L.map('map',{zoomControl:false}).setView([-14.5,-72],6);
    L.control.zoom({position:'bottomright'}).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
      attribution:'© OpenStreetMap © CARTO',maxZoom:18
    }).addTo(map);
    ${markers}
    L.polyline([${route}],{color:'#2563eb',weight:2,opacity:.5,dashArray:'6 4'}).addTo(map);
    map.fitBounds([${route}],{padding:[30,30]});
  <\/script></body></html>`;

  const blob = new Blob([mapHtml], {type:'text/html'});
  const url = URL.createObjectURL(blob);

  el.innerHTML=`
    <div class="sh">ROTA DA VIAGEM</div>
    <div class="map-wrap">
      <iframe class="map-frame" src="${url}" title="Mapa do Peru" sandbox="allow-scripts" loading="lazy"></iframe>
      <div class="map-legend">
        ${PINS.map(p=>`<span class="map-leg">${p.emoji} ${p.label}</span>`).join("")}
      </div>
    </div>
    <div style="font-size:11px;color:var(--ink-4);margin-top:8px;padding:0 2px">Rota aproximada. Toque nos pins pra ver o dia correspondente.</div>
  `;
}

        <div class="ck-body"><div class="ck-t${state.checks[id]?" on":""}">${t}</div>${m?`<div class="ck-m">${m}</div>`:""}</div>
      </div>`).join("")}
    </div>
    <div class="sh">BAGAGEM — ESSENCIAIS</div>
    <div class="card">
      ${[
        ["bag-1","Casaco pesado + térmica","Cusco/Titicaca: −3°C de madrugada"],
        ["bag-2","Tênis/bota de trekking","MP, Vale Sagrado, Colca opcional"],
        ["bag-3","Protetor solar FPS 50+ e óculos","Altitude = sol agressivo"],
        ["bag-4","Garrafa reutilizável","Não se compra água fácil em MP"],
        ["bag-5","Adaptador universal de tomada","Peru geralmente = padrão BR, mas leve"],
        ["bag-6","Kit remédios","Dipirona, ibuprofeno, antiácido, soroche pills"],
        ["bag-7","Dinheiro: ~300 USD + cartão sem IOF","Wise, C6 Global ou Nomad"],
      ].map(([id,t,m])=>`<div class="ck-row" data-ck="${id}" data-grp="0">
        <div class="ck-dot${state.checks[id]?" on":""}"></div>
        <div class="ck-body"><div class="ck-t${state.checks[id]?" on":""}">${t}</div>${m?`<div class="ck-m">${m}</div>`:""}</div>
      </div>`).join("")}
    </div>
    <div class="sh">CONTATOS ÚTEIS</div>
    <div class="card">
      <div class="res-group">
        <div class="res-row"><div class="res-k">EMERGÊNCIA</div><div class="res-v">105 (polícia) · 116 (bombeiros)<span class="sub">Funciona em todo o Peru</span></div></div>
        <div class="res-row"><div class="res-k">CONSULADO BR</div><div class="res-v">Lima: +51 1 512-0830<span class="sub">Av. José Pardo 850, Miraflores</span></div></div>
        <div class="res-row"><div class="res-k">INCA RAIL</div><div class="res-v">+51 84 233030<span class="sub">incarail.com</span></div></div>
      </div>
    </div>
  `;
  // bind checks in info
  el.querySelectorAll("[data-ck]").forEach(r=>r.addEventListener("click",async()=>{
    const id=r.dataset.ck;state.checks[id]=!state.checks[id];
    await sSet("ck",state.checks);renderInfo();renderKpi();
  }));
}

/* ================================================================
   TABS
================================================================ */
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab");if(!b) return;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));
  document.querySelectorAll(".p").forEach(p=>p.classList.remove("on"));
  b.classList.add("on");document.getElementById(b.dataset.p).classList.add("on");
});

/* ================================================================
   BOOT
================================================================ */
(async()=>{
  await load();
  renderKpi();renderChecklist();renderAgenda();renderReservas();renderMap();renderInfo();
  setInterval(renderKpi,60000);
})();
</script>
